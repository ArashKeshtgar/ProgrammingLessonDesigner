name: Verify and deploy

# Every push runs every example's tests in its own language, builds and starts the Docker
# stack, runs the ops scripts in a container, then builds the site, prints the booklet PDFs
# and publishes to the gh-pages branch.
# The site is deployed only when all of that passes: the "tested" label on a sample is earned here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      mongo: { image: "mongo:7", ports: ["27017:27017"] }
    defaults: { run: { working-directory: examples/backend/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: examples/backend/python/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q
        env: { MONGO_URL: "mongodb://localhost:27017" }

  typescript:
    runs-on: ubuntu-latest
    services:
      mongo: { image: "mongo:7", ports: ["27017:27017"] }
    defaults: { run: { working-directory: examples/backend/typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: examples/backend/typescript/package-lock.json }
      - run: npm ci
      - run: npx tsc -p . --noEmit
      - run: npm test
        env: { MONGO_URL: "mongodb://localhost:27017" }

  csharp:
    runs-on: ubuntu-latest
    services:
      mongo: { image: "mongo:7", ports: ["27017:27017"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet test examples/backend/csharp
        env: { MONGO_URL: "mongodb://localhost:27017" }
      - run: dotnet test examples/frontend/blazor

  java:
    runs-on: ubuntu-latest
    services:
      mongo: { image: "mongo:7", ports: ["27017:27017"] }
    defaults: { run: { working-directory: examples/backend/java } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B test
        env: { MONGO_URL: "mongodb://localhost:27017" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: examples/frontend/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: examples/frontend/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the four images and wait for them to be healthy
        run: |
          export JWT_SECRET=$(openssl rand -base64 48) JWT_REFRESH_SECRET=$(openssl rand -base64 48)
          docker compose -f examples/docker/compose.yml up --build --wait --wait-timeout 300
          for port in 8081 8082 8083 8084; do curl -fsS "http://localhost:$port/status"; echo; done
      - name: Compose refuses to start without the secrets
        run: |
          if docker compose -f examples/docker/compose.yml config > /dev/null 2>&1; then echo "expected a failure"; exit 1; fi

  ops:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck examples/ops/*/*.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          $found = Invoke-ScriptAnalyzer -Path examples/ops -Recurse -Severity Warning, Error
          $found | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
          if ($found) { exit 1 }
      - name: Python compiles
        run: python3 -m py_compile examples/ops/*/*.py
      - name: actionlint on the deploy workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 examples/ops/ci/deploy-vps.yml
      - name: Every script in bash, PowerShell and Python, in Ubuntu 24.04
        run: docker build -t lessons-ops examples/ops && docker run --rm lessons-ops
      - name: Caddy and nginx in front of an app
        run: examples/ops/proxy/test.sh

  deploy:
    needs: [python, typescript, csharp, java, frontend, docker, ops]
    # Pinned: Playwright's --with-deps needs an Ubuntu release it knows.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run lint:css
      - run: npx vue-tsc -b && npx vite build --base=/${{ github.event.repository.name }}/
      - name: Print the booklets to PDF
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --base=/${{ github.event.repository.name }}/ --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -fs http://localhost:4173/${{ github.event.repository.name }}/ > /dev/null && break; sleep 1; done
          SITE_URL=http://localhost:4173/${{ github.event.repository.name }}/ npm run pdf
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true
